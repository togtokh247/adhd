<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHD & PHQ-9 Скрининг</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" id="app"></div>

<script>
const ADULT_QUESTIONS = [
  { id:'a1', section:'Анхаарал төвлөрөлт', text:'Даалгавар эсвэл тоглоом хийх үед удаан анхаарлаа барьж чадахгүй байдаг уу?' },
  { id:'a2', section:'Анхаарал төвлөрөлт', text:'Ажил эсвэл тоглоом хийх үед үл тоох алдаа гаргах нь элбэг байдаг уу?' },
  { id:'a3', section:'Анхаарал төвлөрөлт', text:'Шууд хэлэх үед сонсохгүй байдаг мэт санагддаг уу?' },
  { id:'a4', section:'Анхаарал төвлөрөлт', text:'Зааварчилгааг дагаж, даалгавраа дуусгаж чаддаггүй уу?' },
  { id:'a5', section:'Анхаарал төвлөрөлт', text:'Ажил, үүргээ зохион байгуулахад хэцүү байдаг уу?' },
  { id:'a6', section:'Анхаарал төвлөрөлт', text:'Оюуны хүчин чармайлт шаарддаг даалгавраас зайлсхийдэг үү?' },
  { id:'a7', section:'Анхаарал төвлөрөлт', text:'Ажил эсвэл өдөр тутмын амьдралд хэрэгтэй зүйлсээ байнга хаядаг уу?' },
  { id:'a8', section:'Анхаарал төвлөрөлт', text:'Гадны зүйлд амархан сатаардаг уу?' },
  { id:'a9', section:'Анхаарал төвлөрөлт', text:'Өдөр тутмын үйл ажиллагаандаа мартамхай байдаг уу?' },
  { id:'a10', section:'Хэт идэвхтэй байдал', text:'Суугаа үедээ гар хөлөө тайван байлгаж чаддаггүй уу?' },
  { id:'a11', section:'Хэт идэвхтэй байдал', text:'Суух ёстой газраасаа байнга босдог уу?' },
  { id:'a12', section:'Хэт идэвхтэй байдал', text:'Тохиромжгүй газарт гүйх, үсрэх зэргээр хэт идэвхтэй байдаг уу?' },
  { id:'a13', section:'Хэт идэвхтэй байдал', text:'Чимээгүй байх ёстой газарт чанга яриад байдаг уу?' },
  { id:'a14', section:'Хэт идэвхтэй байдал', text:'"Мотор"-той мэт байнга хөдөлж байдаг уу?' },
  { id:'a15', section:'Хэт идэвхтэй байдал', text:'Хэт их ярьдаг уу?' },
  { id:'a16', section:'Импульс', text:'Асуулт дуусахаас өмнө хариулт хэлдэг үү?' },
  { id:'a17', section:'Импульс', text:'Ээлжээ хүлээхэд хэцүү байдаг уу?' },
  { id:'a18', section:'Импульс', text:'Бусдыг тасалдуулж, ярианд нь оролцдог уу?' },
];

const PHQ9_QUESTIONS = [
  { id:'p1', section:'Сэтгэл хөдлөл', text:'Юм хийх дургүй болох, өмнө таашаал авч байсан зүйлдээ сонирхол багасах' },
  { id:'p2', section:'Сэтгэл хөдлөл', text:'Гунигтай, уналтад орсон, найдваргүй мэт санагдах' },
  { id:'p3', section:'Нойр', text:'Унтаж чадахгүй байх эсвэл хэт их унтах' },
  { id:'p4', section:'Эрч хүч', text:'Ядарч, эрч хүч дутагдах' },
  { id:'p5', section:'Хоол тэжээл', text:'Хоолны дур алдах эсвэл хэт их идэх' },
  { id:'p6', section:'Өөрийгөө үнэлэх', text:'Өөрийгөө дорд үзэх — бүтэлгүйтсэн мэт, гэр бүл, найздаа урвасан мэт санагдах' },
  { id:'p7', section:'Анхаарал', text:'Уншсан зүйл, ТВ үзэх зэрэгт анхаарлаа төвлөрүүлэхэд хэцүү байх' },
  { id:'p8', section:'Хөдөлгөөн', text:'Хөдөлгөөн болон яриа удаашрах, эсвэл тайван суужчадахгүй байнга хөдөлж байх' },
  { id:'p9', section:'Аюулгүй байдал', text:'Өөрийгөө гэмтээх эсвэл амь насаа хохироох тухай бодол төрөх' },
];

const ADHD_OPTIONS = ['Хэзээ ч үгүй','Ховор','Заримдаа','Байнга','Үргэлж'];
const PHQ9_OPTIONS  = ['Огт үгүй','Хэд хоног','7-с дээш хоног','Бараг өдөр бүр'];

const PER_PAGE = 6;

let state = { screen: 'start', testType: null, answers: {}, page: 0 };

function questions() {
  return state.testType === 'phq9' ? PHQ9_QUESTIONS : ADULT_QUESTIONS;
}

function currentOptions() {
  return state.testType === 'phq9' ? PHQ9_OPTIONS : ADHD_OPTIONS;
}

function render() {
  const app = document.getElementById('app');
  if (state.screen === 'start')       renderStart(app);
  else if (state.screen === 'test')   renderTest(app);
  else                                renderResult(app);
}

function renderStart(app) {
  app.innerHTML = `
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
      </div>
      <div>
        <div class="logo-text">Скрининг Тест</div>
        <div class="logo-sub">DSM-5 суурилсан</div>
      </div>
    </div>

    <div class="hero">
      <div class="hero-badge">СКРИНИНГ ТЕСТ</div>
      <h1>Сэтгэцийн эрүүл мэнд<br>шалгалт өөрөө хийх</h1>
      <p>Мэргэжлийн аргачлалд суурилсан скрининг үнэлгээ</p>
    </div>

    <div class="card">
      <div class="age-label">Судалгааны төрлөө сонгоно уу</div>
      <div class="age-grid">
        <div class="age-card ${state.testType==='adhd'?'selected':''}" onclick="setType('adhd')">
          <div style="display:flex;justify-content:space-between">
            <div class="age-card-icon">⚡</div>
            <div class="age-check"><svg viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
          </div>
          <div class="age-card-title">ADHD</div>
          <div class="age-card-sub">Анхаарал алдагдал & хэт идэвхтэй байдал</div>
        </div>
        <div class="age-card ${state.testType==='phq9'?'selected':''}" onclick="setType('phq9')">
          <div style="display:flex;justify-content:space-between">
            <div class="age-card-icon">🧠</div>
            <div class="age-check"><svg viewBox="0 0 12 12"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
          </div>
          <div class="age-card-title">PHQ-9</div>
          <div class="age-card-sub">Депресс шалгах судалгаа</div>
        </div>
      </div>
      <button class="start-btn" onclick="startTest()" ${!state.testType?'disabled':''}>Тест эхлэх →</button>
    </div>
  `;
}

function setType(t) {
  state.testType = t;
  state.answers = {};
  render();
}

function startTest() {
  if (!state.testType) return;
  state.screen = 'test';
  state.page = 0;
  render();
}

function renderTest(app) {
  const qs = questions();
  const opts = currentOptions();
  const total = qs.length;
  const start = state.page * PER_PAGE;
  const end = Math.min(start + PER_PAGE, total);
  const pageQs = qs.slice(start, end);
  const allAnswered = pageQs.every(q => state.answers[q.id] !== undefined);
  const answered = Object.keys(state.answers).length;
  const progress = Math.round((answered / total) * 100);
  const totalPages = Math.ceil(total / PER_PAGE);

  const testLabel = state.testType === 'phq9'
    ? 'PHQ-9 — Сүүлийн 2 долоо хоногт'
    : 'ADHD — Насанд хүрэгчдэд зориулсан';

  let html = `
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
      </div>
      <div>
        <div class="logo-text">Скрининг Тест</div>
        <div class="logo-sub">${testLabel}</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span>${answered} / ${total} асуулт хариулсан</span>
        <span>${progress}%</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="section-chip">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
      ${pageQs[0].section}
    </div>
  `;

  pageQs.forEach((q, idx) => {
    html += `<div class="card">
      <div class="q-num">Асуулт ${start + idx + 1}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">`;
    opts.forEach((opt, i) => {
      const sel = state.answers[q.id] === i ? 'selected' : '';
      html += `<button class="opt-btn ${sel}" onclick="answer('${q.id}',${i})">${opt}</button>`;
    });
    html += `</div></div>`;
  });

  html += `<div class="nav">
    ${state.page > 0 ? '<button class="btn-back" onclick="prevPage()">← Өмнөх</button>' : ''}
    <button class="btn-next" onclick="nextPage()" ${!allAnswered?'disabled':''}>
      ${end >= total ? 'Дүн харах ✓' : 'Дараах →'}
    </button>
    <span class="page-info">${state.page+1} / ${totalPages}</span>
  </div>`;

  app.innerHTML = html;
}

function answer(id, val) {
  state.answers[id] = val;
  render();
}

function nextPage() {
  const qs = questions();
  if ((state.page + 1) * PER_PAGE >= qs.length) {
    state.screen = 'result';
  } else {
    state.page++;
  }
  render();
}

function prevPage() {
  if (state.page > 0) { state.page--; render(); }
}

function renderResult(app) {
  if (state.testType === 'phq9') {
    renderPHQ9Result(app);
  } else {
    renderADHDResult(app);
  }
}

function renderPHQ9Result(app) {
  const qs = PHQ9_QUESTIONS;
  const sTotal = qs.reduce((s, q) => s + (state.answers[q.id] || 0), 0);
  const mTotal = qs.length * 3;
  const pct = Math.round((sTotal / mTotal) * 100);

  function phq9Level(s) {
    if (s <= 4)  return ['badge-low',  '● Маш бага',       'Депрессийн шинж тэмдэг бага буюу огт байхгүй.'];
    if (s <= 9)  return ['badge-low',  '● Хөнгөн',         'Хөнгөн зэргийн депрессийн шинж тэмдэг илэрч байна.'];
    if (s <= 14) return ['badge-mid',  '● Дунд зэрэг',     'Дунд зэргийн депрессийн шинж тэмдэг илэрч байна.'];
    if (s <= 19) return ['badge-mid',  '● Дундаас дээш',   'Дундаас дээш зэргийн депрессийн шинж тэмдэг илэрч байна.'];
    return              ['badge-high', '● Хүнд',            'Хүнд зэргийн депрессийн шинж тэмдэг илэрч байна.'];
  }

  const [bc, bl, desc] = phq9Level(sTotal);

  const sections = [
    { label:'Сэтгэл хөдлөл',      ids:['p1','p2'], color:'#7C3AED' },
    { label:'Нойр & Эрч хүч',     ids:['p3','p4'], color:'#D95B2B' },
    { label:'Хоол & Өөрийгөө үнэлэх', ids:['p5','p6'], color:'#059669' },
    { label:'Анхаарал & Хөдөлгөөн', ids:['p7','p8'], color:'#2B7FDD' },
  ];

  function secScore(ids) {
    return ids.reduce((s, id) => s + (state.answers[id] || 0), 0);
  }
  function secMax(ids) { return ids.length * 3; }
  function secPct(ids) { return Math.round((secScore(ids) / secMax(ids)) * 100); }

  app.innerHTML = `
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
      </div>
      <div>
        <div class="logo-text">PHQ-9 Дүн</div>
        <div class="logo-sub">Депресс скрининг үнэлгээ</div>
      </div>
    </div>

    <div class="card" style="text-align:center;padding:1.75rem;">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">Нийт оноо</div>
      <div class="total-score">${sTotal}<span class="total-denom"> / ${mTotal}</span></div>
      <div style="margin-top:6px;">
        <span class="badge ${bc}">${bl}</span>
      </div>
      <div style="margin-top:10px;font-size:13px;color:var(--text-secondary);line-height:1.6;">${desc}</div>
      <div style="margin-top:16px;height:8px;background:#F3F4F6;border-radius:99px;overflow:hidden;">
        <div style="height:8px;border-radius:99px;background:linear-gradient(90deg,#2B7FDD,#60A5FA);width:${pct}%;transition:width 0.8s ease;"></div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">${pct}% — нийт оноонд харьцуулсан</div>
    </div>

    <div class="card">
      <div class="section-title">Хэсгийн дүн</div>
      <div class="section-sub">Дэд бүлгээр үнэлсэн үр дүн</div>
      ${sections.map(s => `
        <div class="score-row">
          <div class="score-dot" style="background:${s.color}"></div>
          <span class="score-label">${s.label}</span>
          <div class="score-track"><div class="score-fill" style="width:${secPct(s.ids)}%;background:${s.color}"></div></div>
          <span class="score-num">${secPct(s.ids)}%</span>
        </div>
      `).join('')}
    </div>

    ${state.answers['p9'] >= 1 ? `
    <div class="card" style="border-color:#FCA5A5;background:#FEF2F2;">
      <div style="font-size:13px;font-weight:700;color:#991B1B;margin-bottom:6px;">⚠ Чухал</div>
      <div style="font-size:13px;color:#7F1D1D;line-height:1.6;">9-р асуултад эерэг хариулт өгсөн байна. Нэн даруй мэргэжлийн эмчтэй зөвлөлдөхийг зөвлөж байна.</div>
    </div>` : ''}

    <div class="nav">
      <button class="btn-back" onclick="restart()">← Дахин эхлэх</button>
    </div>
  `;
}

function renderADHDResult(app) {
  const qs = questions();
  const inattentive = qs.filter(q => q.section === 'Анхаарал төвлөрөлт');
  const hyperactive  = qs.filter(q => q.section === 'Хэт идэвхтэй байдал');
  const impulsive    = qs.filter(q => q.section === 'Импульс');

  const score = arr => arr.reduce((s,q) => s + (state.answers[q.id] || 0), 0);
  const maxScore = arr => arr.length * 4;
  const pct = (s,m) => Math.round((s/m)*100);

  const sI  = score(inattentive);
  const sH  = score(hyperactive);
  const sIm = score(impulsive);
  const sTotal = sI + sH + sIm;
  const mTotal = maxScore(inattentive) + maxScore(hyperactive) + maxScore(impulsive);
  const totalPct = pct(sTotal, mTotal);

  function badge(s, m) {
    const p = pct(s, m);
    if (p < 40) return ['badge-low', '● Бага хэмжээ'];
    if (p < 65) return ['badge-mid', '● Дунд хэмжээ'];
    return ['badge-high', '● Өндөр хэмжээ'];
  }

  function bar(s, m, color) {
    return `<div class="score-fill" style="width:${pct(s,m)}%;background:${color}"></div>`;
  }

  const [bc, bl] = badge(sTotal, mTotal);

  const sections = [
    { label:'Анхаарал төвлөрөлт', s:sI,  m:maxScore(inattentive), color:'#7C3AED', dot:'#7C3AED' },
    { label:'Хэт идэвхтэй байдал', s:sH,  m:maxScore(hyperactive),  color:'#D95B2B', dot:'#D95B2B' },
    { label:'Импульс',             s:sIm, m:maxScore(impulsive),    color:'#059669', dot:'#059669' },
  ];

  app.innerHTML = `
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/></svg>
      </div>
      <div>
        <div class="logo-text">ADHD Дүн</div>
        <div class="logo-sub">Скрининг үнэлгээ</div>
      </div>
    </div>

    <div class="card" style="text-align:center;padding:1.75rem;">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">Нийт оноо</div>
      <div class="total-score">${sTotal}<span class="total-denom"> / ${mTotal}</span></div>
      <div style="margin-top:6px;">
        <span class="badge ${bc}">${bl}</span>
      </div>
      <div style="margin-top:16px;height:8px;background:#F3F4F6;border-radius:99px;overflow:hidden;">
        <div style="height:8px;border-radius:99px;background:linear-gradient(90deg,#2B7FDD,#60A5FA);width:${totalPct}%;transition:width 0.8s ease;"></div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">${totalPct}% — нийт оноонд харьцуулсан</div>
    </div>

    <div class="card">
      <div class="section-title">Дэд бүлгийн дүн</div>
      <div class="section-sub">Гурван чиглэлээр үнэлэгдсэн үр дүн</div>
      ${sections.map(s => `
        <div class="score-row">
          <div class="score-dot" style="background:${s.dot}"></div>
          <span class="score-label">${s.label}</span>
          <div class="score-track">${bar(s.s, s.m, s.color)}</div>
          <span class="score-num">${pct(s.s,s.m)}%</span>
        </div>
      `).join('')}
    </div>

    <div class="nav">
      <button class="btn-back" onclick="restart()">← Дахин эхлэх</button>
    </div>
  `;
}

function restart() {
  state = { screen: 'start', testType: null, answers: {}, page: 0 };
  render();
}

render();
</script>
</body>
</html>
